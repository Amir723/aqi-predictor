name: Hourly Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"  # Every hour
  workflow_dispatch:

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: |
          pip install pandas pymongo requests python-dotenv
      
      - name: Fetch current data
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python features/fetch_data.py
